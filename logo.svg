<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220">
  <defs>
    <linearGradient id="gradLuna" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b21a8"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="gradCirculo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="gradYS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Luna creciente morada -->
  <path d="M 100 20
           A 80 80 0 1 0 100 180
           A 60 60 0 1 1 100 20 Z"
        fill="url(#gradLuna)"/>

  <!-- Círculo azul claro (luna llena parcial) -->
  <circle cx="105" cy="100" r="42" fill="url(#gradCirculo)" opacity="0.85"/>

  <!-- Nube izquierda -->
  <g fill="#ffffff" stroke="#c084fc" stroke-width="2">
    <ellipse cx="42" cy="130" rx="20" ry="13"/>
    <ellipse cx="60" cy="128" rx="14" ry="10"/>
    <ellipse cx="30" cy="128" rx="14" ry="10"/>
  </g>

  <!-- Nube derecha -->
  <g fill="#ffffff" stroke="#c084fc" stroke-width="2">
    <ellipse cx="160" cy="140" rx="18" ry="12"/>
    <ellipse cx="176" cy="138" rx="12" ry="9"/>
    <ellipse cx="148" cy="138" rx="12" ry="9"/>
  </g>

  <!-- Estrellitas -->
  <g fill="#c084fc">
    <path d="M 45 55 L 47 62 L 54 64 L 47 66 L 45 73 L 43 66 L 36 64 L 43 62 Z"/>
    <path d="M 150 45 L 152 52 L 159 54 L 152 56 L 150 63 L 148 56 L 141 54 L 148 52 Z"/>
    <path d="M 175 95 L 176 99 L 180 100 L 176 101 L 175 105 L 174 101 L 170 100 L 174 99 Z"/>
    <path d="M 70 165 L 71 169 L 75 170 L 71 171 L 70 175 L 69 171 L 65 170 L 69 169 Z"/>
  </g>

  <!-- Estrella grande brillante -->
  <g fill="#a855f7" opacity="0.9">
    <path d="M 138 78 L 140 86 L 148 88 L 140 90 L 138 98 L 136 90 L 128 88 L 136 86 Z"/>
  </g>

  <!-- Texto YS -->
  <text x="100" y="212"
        font-family="'Dancing Script', 'Brush Script MT', cursive"
        font-size="44"
        font-weight="700"
        fill="url(#gradYS)"
        text-anchor="middle">YS</text>
</svg>